automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5", "claude-fable-5-1"]
      framework: "Claude Code"
      tool_setup: >-
        AI-assisted proof development, driven from a task list in the repository and reviewed by
        the author at each step.  The agent wrote the Lean, wrote the Sage and mpmath scripts in
        Code/ that certify the numerical hypotheses and regenerate the paper's tables, opened and
        checked each cited paper against the statement transcribed from it, and maintained the
        audit documents.  Mathematical direction, acceptance of every result and all of the
        mathematics in the source preprint are the author's.
      cost:
        wall_time: "about three weeks of elapsed time"
        spend_usd: "subscription-based usage; not tracked per task"
        hardware: "local machine, API-only models"
      prompting_notes: >-
        Tasks were given as a written work list, and completed entries were annotated in place, so
        that list is a running record of what was asked and what was done.
  spend_usd: "subscription-based usage; not tracked"
  notes: >-
    Three checks were applied throughout and are visible in the repository.  Every cited result
    was read in the original paper before being assumed; every numeric claim was isolated as its
    own statement and certified by an independent script in Code/, usually twice, once with arb
    ball arithmetic and once with mpmath; and every declaration carries a docstring recording its
    proof sketch, its correspondence with the source, and any divergence found.

fidelity:
  divergences: >-
    The k = 0 anchor of the piecewise-linear majorant has two admissible values in the source.  The
    Lean uses the main text's (1/6, 1, log 0.611); the source's displayed tables use the
    alternative (27/164, 0, log 66.7) given in its Remark 7.  The two agree for
    every chord index above zero, so they differ only where the circle reaches the k = 0 chord.
    The consequence is that the Lean's threshold alpha < 1/6 is the main text's, and is the
    conservative one; the tables' triple would allow alpha < 7/41.

    All three submitted forms of Corollary 1 quantify eta, the unique root of
    1 + eta + log eta = 0 in (0,1), universally under that characterisation rather than
    constructing it.  They are therefore slightly more general than the development's version.

    NOT A DIVERGENCE, recorded here because it looks like one.  The source's Corollary 1 has no
    r in it: it asserts an "explicitly computable positive constant" and its proof takes
    "the relevant C_2" from Corollary 4 or 5, which do carry r.  So the source leaves the radius
    implicit, and any statement that names the constant has to choose.
    positive_proportion_in_middle_band and positive_proportion_sixteenth name it, at r = 1/2 and
    r = 1/5; positive_proportion leaves the constant existential and so mentions no radius at
    all, matching the source's phrasing exactly.  r = 1/2 is admissible for every alpha in
    (0, 1/6), which is what lets the positivity be discharged rather than assumed.  It is not the
    best radius: positive_proportion_sixteenth gets a limiting constant of 9/25 at alpha = 1/16
    against r = 1/2's 5/21.  The submitted Corollaries 4 and 5 carry r as a free variable, as the
    source does, and the library keeps the version parametrised over r and the chord index.

    The Solution module duplicates the Challenge module's definitions verbatim.  That is forced by
    the submission format, not a mathematical difference: Comparator compares a declaration of the
    same name in two modules, and a Challenge may import nothing outside Mathlib.

review:
  # This field is the review status OF THE FORMALIZATION, not of the paper.  The author checked
  # their own work as it was produced and no one else has; that is exactly `self-assessed`.  The
  # paper's separate journal review is stated in `notes`, where it cannot be mistaken for a
  # review of the Lean.
  status: "self-assessed"
  reviewers:
    - "Andrew Fiori"
  notes: >-
    No external review of the formalization has been completed.  The author, who is also the
    author of the source preprint, reviewed it as it was produced.  The paper itself is under
    review at a journal; that is a separate process and says nothing about the Lean.

alignment:
  namespace: "ZeroDensityShortIntervals"
  statements:
    - source: "Corollary 1 (cor:simpmain)"
      lean: "ZeroDensityShortIntervals.positive_proportion_in_middle_band"
      module: "Solution"
      status: "proved, conditionally"
      note: >-
        Submitted; the form of Corollary 1 with the constant named.  It is the development's
        HalvingConvention.simpleProportionCorollary_littlewood_prose restated over Mathlib alone,
        with eta universally quantified and the positivity of the constant added as a hypothesis.
    - source: "Corollary 1 (cor:simpmain), the source's sentence with nothing named"
      lean: "ZeroDensityShortIntervals.positive_proportion"
      module: "Solution"
      status: "proved, conditionally"
      note: >-
        Submitted.  The same content as positive_proportion_in_middle_band with the constant
        existentially quantified, which is what the source's prose literally says: for every alpha
        in (0, 1/6) there are C > 0, h0 and t0 with the proportion exceeding C on every larger
        window.  Stated separately because a reader can check it against the prose without first
        unfolding CsimpLittlewood.
    - source: "Corollary 1 (cor:simpmain) at explicit parameters"
      lean: "ZeroDensityShortIntervals.positive_proportion_sixteenth"
      module: "Solution"
      status: "proved, conditionally"
      note: >-
        Submitted.  alpha = 1/16, radius r = 1/5, chord index k = 1, where A1 = 4/25 and the
        limiting constant is 1 - 4*A1 = 9/25 against r = 1/2's 5/21.  Present so that the two
        statements above are visibly not vacuous; the source's tables give 0.3484 at h0 = 100,
        t0 = 10^10000, approaching 9/25 from below.
    - source: "Theorem 2 (thm:main-jensen)"
      lean: "ZeroDensityShortIntervals.zero_density_jensen"
      module: "Solution"
      status: "proved, conditionally"
      note: >-
        Submitted.  The development's MainTheorem.mainJensen.  Carries the source's hypothesis
        t >= e, which is where the collapsed error bracket becomes valid.
    - source: "Theorem 3 (thm:main-littlewood)"
      lean: "ZeroDensityShortIntervals.zero_density_littlewood"
      module: "Solution"
      status: "proved, conditionally"
      note: >-
        Submitted.  The development's MainTheorem.mainLittlewood.  Carries the source's hypothesis
        t >= e^e for the same reason, and additionally that zeta not vanish on the two horizontal
        edges of the enlarged window.
    - source: "Corollary 4 (cor:main-jensen)"
      lean: "ZeroDensityShortIntervals.edge_proportion_jensen"
      module: "Solution"
      status: "proved, conditionally"
      note: >-
        Submitted.  The development's HalvingConvention.mainPositiveProportionCorollary_jensen_half,
        the half-counting form of the corollary.
    - source: "Corollary 5 (cor:main-littlewood)"
      lean: "ZeroDensityShortIntervals.edge_proportion_littlewood"
      module: "Solution"
      status: "proved, conditionally"
      note: >-
        Submitted.  The development's
        HalvingConvention.mainPositiveProportionCorollary_littlewood_half.  This is what the
        headline corollary uses.
    - source: "Theorem 32 (thm:littlewoodshort)"
      lean: "littlewoodshort"
      module: "ZerosInShortIntervals.Littlewood.LittlewoodShort"
      status: "proved, conditionally"
      note: >-
        Not submitted.  The Littlewood short-interval theorem, which supplies the coefficients
        A1..A6 of the submitted Theorem 3.
    - source: "Theorem 31 (thm:arg-integrals)"
      lean: "arg_integrals"
      module: "ZerosInShortIntervals.Littlewood.ArgIntegrals"
      status: "proved"
      note: >-
        Unconditional and axiom-clean: it carries no hypothesis-class binder and depends only on
        propext, Classical.choice and Quot.sound.  It is the source's own technical contribution
        and is a candidate for a separate submission.
    - source: "the factor of two in every proportion statement, left implicit in the source"
      lean: "zetaOrd_reflect"
      module: "ZerosInShortIntervals.Reflection"
      status: "proved"
      note: >-
        The reflection rho -> 1 - conj(rho) preserves the order of vanishing of zeta off the real
        axis, so the two edge strips of a window carry equally many zeros.  Unconditional.  This
        is what lets the counting statement be read as a statement about a proportion.

acknowledgements: >-
  Built on Mathlib.  Numerical certificates computed with arb through Sage, and independently with
  mpmath.  The scripts are in Code/ and each names the statement it certifies.
