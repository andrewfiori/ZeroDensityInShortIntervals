status:
  scope: >-
    Formalized and proved: both main theorems (Jensen and Littlewood mechanisms), both
    corollaries, the Littlewood short-interval theorem, the argument-integral machinery, the
    appendix of explicit zeta bounds, the Laurent expansion of zeta'/zeta, the reflection step,
    and the headline Corollary 1 in three forms.

    SEVEN statements are submitted and compared, not one.  Both main theorems
    (zero_density_jensen for Theorem 2, zero_density_littlewood for Theorem 3), both corollaries
    (edge_proportion_jensen for Corollary 4, edge_proportion_littlewood for Corollary 5), and all
    three forms of Corollary 1 (positive_proportion_in_middle_band with the constant named,
    positive_proportion with it existentially quantified as the source phrases it, and
    positive_proportion_sixteenth at alpha = 1/16 with the sharper radius r = 1/5).
    `comparator.json` is the authority and lists exactly these seven; `main_results` below and
    `alignment.statements` at the end of this file match it declaration for declaration.

    What is NOT submitted is the supporting machinery the seven rest on -- Theorem 32, Theorem 31,
    the appendix of zeta bounds, the Laurent expansion and the reflection.  Those are proved in
    the development but Comparator does not check them.

    Not proved, and assumed instead: twenty-three literature bounds and numerical certificates,
    listed as fields of six hypothesis classes and gathered for this submission into one bundled
    class that appears in the submitted signature.  The development contains no `axiom` and no
    `sorry`; every result that depends on an assumption carries it in its type.

    Proved, and worth stating explicitly: the constant is positive, for every
    alpha in the source's own range (0, 1/6), with no additional hypothesis.  The source states its
    Corollary 1 for "h0 and t0 sufficiently large", and that existential is what makes positivity
    provable without numerics.  Every term of C_2 except the leading 2*A1 carries a factor 1/h,
    1/log t or loglog t / log t and the denominator tends to 1, so C_2 tends to 2*A1; nothing about
    the sizes of the remaining coefficients is needed, only that they do not depend on h or t.
    What remains is 4*A1 < 1, and the radius r = 1/2 discharges it outright: the chord abscissa
    sigma_0 is exactly 1/2, so the evaluation point 1-r is a chord endpoint, the interpolation
    collapses, and 4*A1 = (1/3)/(1/2 - alpha), which is below 1 precisely when alpha < 1/6.  No
    interval arithmetic enters any of this.  The tables remain the source of the numerical VALUES
    of the constant; they are not load-bearing for its sign.

    Each submitted statement assumes the whole development's hypothesis bundle, including fields
    that particular statement does not use.  That makes each of them slightly weaker than
    necessary.

    The three Corollary 1 forms depart from the source's shape in one way: eta is quantified by
    its characterisation rather than constructed.  That is recorded under `fidelity` below.  The
    radius r is NOT such a departure -- the source's Corollary 1 does not mention r at all, and
    its one-line proof defers to Corollary 4 or 5 "for the relevant C_2", leaving the choice
    implicit; naming the constant, as two of the three forms do, is what forces a choice to be
    made explicit.  The submitted Theorems 2
    and 3 and Corollaries 4 and 5 keep the source's own shape and hypotheses, with one addition
    noted under `alignment`: Theorem 3 also requires that zeta not vanish on the two horizontal
    edges of the enlarged window.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "ZeroDensityShortIntervals.zero_density_jensen"
