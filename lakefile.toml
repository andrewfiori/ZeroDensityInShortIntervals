name = "ZerosInShortIntervals"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ZerosInShortIntervals", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

weak.linter.style.whitespace = false
weak.linter.style.header.license = "Released under CC BY 4.0 license as described in the file LICENSE."

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc1"

[[lean_lib]]
name = "ZerosInShortIntervals"

# The Palomar Registry submission pair.  `Challenge` states the result over Mathlib alone and may
# not import `ZerosInShortIntervals`; `Solution` imports both and proves it.  Both are default
# targets so that a plain `lake build` keeps them honest.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
